# Pings the Render backend every ~10 minutes so the free-tier instance
# doesn't spin down between visits. Without this, the first request after
# 15 minutes of idle time waits ~50s for the dyno to wake up.
name: Keep backend warm

on:
  schedule:
    # GitHub Actions cron is in UTC. */10 means "every 10 minutes".
    # Note: free-tier scheduled workflows can be delayed during high load,
    # so the actual interval may stretch to 15 minutes occasionally.
    - cron: '*/10 * * * *'
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit healthz
        run: |
          # --max-time covers the cold-start case (Render takes up to 50s to wake)
          # --fail makes curl exit non-zero on 4xx/5xx so the job fails visibly
          curl --fail --silent --show-error --max-time 60 \
            https://job-tracker-1-vwvl.onrender.com/healthz/
